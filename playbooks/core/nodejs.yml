---
# Install Node.js LTS system-wide from NodeSource, plus Yarn Classic and
# pnpm, on a multi-user workstation.
#
#   /usr/bin/node, /usr/bin/npm, /usr/bin/npx    from the NodeSource package
#   /usr/bin/yarn, /usr/bin/pnpm                 real npm-global installs, NOT Corepack shims
#   /etc/apt/sources.list.d/nodesource.sources   repository definition, NodeSource's key inline
#
# Node.js itself already lands in a root-owned system path -- npm's global
# prefix on a NodeSource install is /usr -- so this migration is pure
# correctness work: pin the version (the source playbook ran
# NodeSource's own `curl | bash` setup script and installed whatever LTS
# release that resolved to on the day it ran, recording nothing), replace the
# script with a declarative deb822_repository per A5, and take the
# architecture from facts instead of the hardcoded amd64 the setup script's
# own internals assume.
#
# THE YARN/PNPM FIX IS THE REAL WORK HERE. NodeSource's `nodejs` package
# bundles Corepack, and Corepack ships /usr/bin/yarn and /usr/bin/pnpm as its
# own dispatcher shims -- present from the moment nodejs is installed, before
# this playbook's Yarn/pnpm tasks ever run. The source playbook's
# `npm install -g yarn` / `npm install -g pnpm` were guarded on
# `creates: /usr/bin/yarn` / `creates: /usr/bin/pnpm`, which is satisfied by
# Corepack's shims and never actually replaces them -- so on every host that
# has ever run it, "yarn" and "pnpm" are not this repo's install at all: they
# are Corepack's own dispatcher, which downloads whatever version is current
# on the npm registry the first time any account invokes it, non-deterministic
# across accounts and across time, into that account's own npm/Corepack cache.
#
# The fix: `corepack disable` removes Corepack's shims, then
# `npm install -g yarn@<version> pnpm@<version>` --
# already this repo's trusted mechanism for a root-owned global npm install,
# per core/markdownlint.yml -- puts real, pinned packages at the same paths.
#
# The idempotency check never invokes yarn/pnpm directly while a Corepack
# shim might still be at that path: doing so would trigger exactly the
# non-deterministic download this playbook exists to prevent. It instead
# resolves the binary with `readlink -f` and checks whether the path leads
# into Corepack's own tree, and separately asks npm's own package metadata
# (`npm ls -g <pkg>@<version>`) rather than executing the binary at all.
# Only once that confirms a real npm-managed install at the pinned version is
# `yarn --version` / `pnpm --version` run, for the human-readable summary and
# the unprivileged smoke test.
#
# AUDIT REPORT RENDERERS: audit-export and yarn-audit-html, and NOT
# npm-audit-html. The last of those is the obvious npm-side choice and is
# deliberately absent, which is worth recording so nobody adds it back by
# reflex: its templates read the `advisories` key of npm v6's audit JSON, npm
# 7 replaced that with `auditReportVersion: 2` and a `vulnerabilities` map,
# and the package has had no release since 2020-11-11. Measured on this host
# before it was dropped -- a real `npm audit --json` for a project with a
# CRITICAL lodash advisory rendered to a report BYTE-FOR-BYTE IDENTICAL to
# one rendered from an empty audit, with no mention of lodash anywhere in it.
# It installs, it runs, and it reports nothing, which is worse than not
# having it at all.
#
# audit-export takes that place instead, and does read npm 7+'s format: the
# same lodash audit renders to a report whose payload names the package, the
# advisory and its GHSA link. It embeds that payload BASE64-ENCODED in the
# page rather than as markup, so task 25 decodes it before asserting on it --
# grepping the HTML for a package name finds nothing even when the report is
# perfectly good. yarn-audit-html covers the Yarn side and needs no such
# decoding; task 26 carries a synthetic advisory through to its HTML.
#
# Usage:
#   ansible-playbook core/nodejs.yml -e host=<inventory host or group>
#   ansible-playbook core/nodejs.yml -e host=ws01 -e nodejs_version=24.19.0-1nodesource1

- name: Install Node.js LTS, Yarn and pnpm system-wide
  hosts: "{{ host }}"
  become_user: root
  become_method: sudo
  become: true
  remote_user: ubuntu
  gather_facts: true

  vars:
    # dpkg-query's status field for a package that is really installed.
    # One removed but not purged (`deinstall ok config-files`) still reports
    # its version, so every guard below compares the status too, or a removed
    # package reads as "already at the pin" (POLICY.md's C2).
    nodejs_dpkg_ok: "install ok installed|"
    # The stream is part of the pin: moving to Node 26 when it becomes LTS
    # means editing nodejs_stream (which changes the repository URI) as well
    # as nodejs_version, not just the version string.
    nodejs_stream: "24.x"
    nodejs_version: "24.19.0-1nodesource1"
    nodejs_repo_uri: "https://deb.nodesource.com/node_{{ nodejs_stream }}"
    nodejs_suite: nodistro
    # ansible_facts['architecture'] -> apt architecture name. Both amd64 and
    # arm64 Packages indices are confirmed to exist under this repository;
    # the source playbook's setup script mapped this internally, which a
    # declarative deb822_repository task has to do for itself.
    nodejs_arch_map:
      x86_64: amd64
      aarch64: arm64
    nodejs_arch: "{{ nodejs_arch_map.get(ansible_facts['architecture'], '') }}"
    # NodeSource's signing key carries NO EXPIRY (checked 2026-08-15:
    # `gpg --show-keys` reports an empty expiration field on the primary
    # [SC] key), so POLICY.md's A5 pins the bytes inline rather than
    # fetching by URL -- the docker.yml/azure-cli.yml form, not the
    # github-cli.yml/kubectl.yml one.
    nodejs_key_fingerprint: "6F71F525282841EEDAF851B42F59B5F99B1BE0B4"
    nodejs_signing_key: |
      -----BEGIN PGP PUBLIC KEY BLOCK-----

      mQENBFdDN1ABCADaNd/I3j3tn40deQNgz7hB2NvT+syXe6k4ZmdiEcOfBvFrkS8B
      hNS67t93etHsxEy7E0qwsZH32bKazMqe9zDwoa3aVImryjh6SHC9lMtW27JPHFeM
      Srkt9YmH1WMwWcRO6eSY9B3PpazquhnvbammLuUojXRIxkDroy6Fw4UKmUNSRr32
      9Ej87jRoR1B2/57Kfp2Y4+vFGGzSvh3AFQpBHq51qsNHALU6+8PjLfIt+5TPvaWR
      TB+kAZnQZkaIQM2nr1n3oj6ak2RATY/+kjLizgFWzgEfbCrbsyq68UoY5FPBnu4Z
      E3iDZpaIqwKr0seUC7iA1xM5eHi5kty1oB7HABEBAAG0Ik5Tb2xpZCA8bnNvbGlk
      LWdwZ0Bub2Rlc291cmNlLmNvbT6JAU4EEwEKADgCGwMCHgECF4AWIQRvcfUlKChB
