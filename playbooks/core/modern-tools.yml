---
# Install modern CLI tool replacements system-wide on a multi-user workstation.
#
# All thirteen of these are current-enough Ubuntu apt packages, so they need
# no more than a version pin. Three tools from the fifteen-tool source playbook
# are split into their own playbooks instead of bundled here:
#   - yq.yml: Ubuntu's apt `yq` is the unrelated Python jq-wrapper, not
#     mikefarah's Go yq that Homebrew installs, so it needs a release binary
#     instead of a plain apt install.
#   - jsonnet.yml: a plain apt install like the rest of this bundle, split
#     out so it can be pinned and verified independently of the others.
#
#   /usr/bin/<tool>            for everything installed via apt
#   /usr/local/bin/bat         symlink; apt installs the binary as batcat
#   /usr/local/bin/fd          symlink; apt installs the binary as fdfind
#   /etc/profile.d/fzf.sh      fzf key bindings and completion (interactive shells only)
#
# fzf's key bindings only take effect if /etc/profile.d is actually sourced by
# interactive shells: this playbook also lays down the /etc/bash.bashrc hook
# for that (POLICY.md's B3), since fzf is the first tool here that needs
# it. It is a harmless no-op for any later playbook
# that needs the same hook (blockinfile is idempotent on its marker).
#
# Usage:
#   ansible-playbook core/modern-tools.yml -e host=<inventory host or group>

- name: Install modern CLI tools system-wide
  hosts: "{{ host }}"
  become_user: root
  become_method: sudo
  become: true
  remote_user: ubuntu
  gather_facts: true

  vars:
    # dpkg-query's status field for a package that is really installed.
    # One removed but not purged (`deinstall ok config-files`) still reports
    # its version, so every guard below compares the status too, or a removed
    # package reads as "already at the pin" (POLICY.md's C2).
    modern_tools_dpkg_ok: "install ok installed|"
    # apt candidate versions on Ubuntu 26.04 (resolute). apt versions are
    # release-specific (see shellcheck.yml's note on the same issue), so
    # overriding one of these only helps if that exact dpkg version is
    # available from the target's configured apt sources.
    modern_tools_packages:
      - name: gum
        apt_package: gum
        version: "0.17.0-1"
        binary: gum
      - name: fzf
        apt_package: fzf
        version: "0.67.0-1"
        binary: fzf
      - name: ripgrep
        apt_package: ripgrep
        version: "15.1.0-1ubuntu1"
        binary: rg
      - name: bat
        apt_package: bat
        version: "0.25.0-5ubuntu1"
        binary: batcat
        # apt renames the binary; `alias` is the upstream name, published
        # from /usr/local/bin by task 5.
        alias: bat
      - name: eza
        apt_package: eza
        version: "0.23.4-1ubuntu1"
        binary: eza
      - name: fd
        apt_package: fd-find
        version: "10.3.0-2ubuntu1"
        binary: fdfind
        alias: fd
      - name: lsd
        apt_package: lsd
        version: "1.2.0-1"
        binary: lsd
      - name: duf
        apt_package: duf
        version: "0.9.1-1"
        binary: duf
      - name: dust
        apt_package: du-dust
        version: "1.2.4-1ubuntu1"
        binary: dust
      - name: procs
        apt_package: procs
        version: "0.14.10-5build1"
        binary: procs
      - name: gdu
        apt_package: gdu
        version: "5.25.0-1build1"
        binary: gdu
      - name: htop
        apt_package: htop
        version: "3.4.1-5build2"
        binary: htop
      - name: glow
        apt_package: glow
        version: "2.1.1-1"
        binary: glow
    # uid/gid used to prove the install is usable by an arbitrary user
    modern_tools_verify_uid: 65534    # nobody
    modern_tools_verify_gid: 65534    # nogroup

  tasks:
    - name: 1. Check the currently installed version of each apt-based tool
      # ${Status} as well as ${Version} -- see modern_tools_dpkg_ok above.
      ansible.builtin.command: "dpkg-query -W -f='${Status}|${Version}' {{ item.apt_package }}"
      register: modern_tools_installed
      loop: "{{ modern_tools_packages }}"
      loop_control:
        label: "{{ item.name }}"
      changed_when: false
      # check_mode: false throughout this playbook wherever a task only
      # READS state: without it a dry run skips them, and the guards and
      # checks below then act on output that was never produced.
      check_mode: false
      failed_when: false

    - name: 2. Decide which apt-based tools need installing
      # A single filtered list, rather than a per-package task, so the
      # install task below is one apt-get invocation instead of twelve.
      ansible.builtin.set_fact:
        modern_tools_pending: "{{ modern_tools_pending | default([]) + [item.0.apt_package ~ '=' ~ item.0.version] }}"
      loop: "{{ modern_tools_packages | zip(modern_tools_installed.results) | list }}"
      loop_control:
        label: "{{ item.0.name }}"
      when: (modern_tools_dpkg_ok ~ item.0.version) != (item.1.stdout | default(''))

    - name: 2a. Decide whether this run can verify what it installed
      ansible.builtin.set_fact:
        modern_tools_can_verify: >-
          {{ not (ansible_check_mode
                  and (modern_tools_pending | default([]) | length > 0)) }}

    - name: 2b. Note that verification is deferred in this dry run
      ansible.builtin.debug:
        msg: >-
          --check did not install
          {{ modern_tools_pending | default([]) | join(', ') }}, so the version
          checks and the unprivileged runs below are skipped rather than
          failed. Re-run without --check to verify.
      when: not (modern_tools_can_verify | bool)

    - name: 3. Install the apt-based tools that need installing
      ansible.builtin.apt:
        name: "{{ modern_tools_pending | default([]) }}"
        state: present
        update_cache: true
        cache_valid_time: 3600
      when: (modern_tools_pending | default([])) | length > 0

    - name: 4. Verify the installed versions of each apt-based tool
      ansible.builtin.command: "dpkg-query -W -f='${Status}|${Version}' {{ item.apt_package }}"
      register: modern_tools_version_out
      loop: "{{ modern_tools_packages }}"
      loop_control:
        label: "{{ item.name }}"
      changed_when: false
      failed_when: (modern_tools_dpkg_ok ~ item.version) != modern_tools_version_out.stdout
      check_mode: false
      when: modern_tools_can_verify | bool

    - name: 5. Publish the upstream name for tools apt renamed
      # Two of these ship under a different binary name because the upstream
      # one is already taken on Debian: bat is installed as batcat (the bacula
      # tools own /usr/bin/bat) and fd as fdfind (fdclone, a file manager,
      # owns /usr/bin/fd). Documentation, muscle memory and every tutorial use
      # the upstream names, so both are published from /usr/local/bin --
      # which comes before /usr/bin on the default PATH -- rather than left to
      # each account to alias for itself.
      ansible.builtin.file:
        src: "/usr/bin/{{ item.binary }}"
        dest: "/usr/local/bin/{{ item.alias }}"
        state: link
        force: true
      loop: "{{ modern_tools_packages | selectattr('alias', 'defined') | list }}"
      loop_control:
        label: "{{ item.alias }} -> {{ item.binary }}"
      register: modern_tools_links

    - name: 6. Add fzf key bindings and completion for interactive shells
      ansible.builtin.copy:
        dest: /etc/profile.d/fzf.sh
        mode: '0644'
        content: |
          # fzf key bindings and fuzzy completion
          eval "$(fzf --bash)"
      register: modern_tools_fzf_profile

    - name: 7. Ensure interactive non-login shells read /etc/profile.d
      # /etc/profile.d/*.sh is only sourced by login shells by default; an
      # SSH session that starts a non-login interactive bash reads
      # /etc/bash.bashrc instead, which does not loop over /etc/profile.d on
      # a stock Ubuntu install. Without this, fzf.sh above is silently never
      # read by the common case of an interactive SSH session.
      ansible.builtin.blockinfile:
        path: /etc/bash.bashrc
        marker: "# {mark} ANSIBLE MANAGED BLOCK: profile.d for interactive shells"
        block: |
          for f in /etc/profile.d/*.sh; do [ -r "$f" ] && . "$f"; done
      register: modern_tools_bashrc

    - name: 8. Run each tool as an unprivileged user
      # A non-login interactive shell (bash -i), not a plain command, so
      # /etc/bash.bashrc and therefore /etc/profile.d/fzf.sh are actually
      # exercised end-to-end, not just the binaries themselves.
      ansible.builtin.shell:
        cmd: >-
          setpriv --reuid={{ modern_tools_verify_uid }} --regid={{ modern_tools_verify_gid }} --clear-groups
          bash -i -c '{{ item.binary }} --version'
      loop: "{{ modern_tools_packages }}"
      loop_control:
        label: "{{ item.name }}"
      environment:
        HOME: /tmp
        TMPDIR: /tmp
      register: modern_tools_smoke
      changed_when: false
      check_mode: false
      when: modern_tools_can_verify | bool

    - name: 9. Run the renamed tools under their upstream name
      # Proves the symlinks in task 5 resolve for an arbitrary account and,
      # because this goes through PATH rather than a full path, that
      # /usr/local/bin really does win over /usr/bin for them.
      ansible.builtin.shell:
        cmd: >-
          setpriv --reuid={{ modern_tools_verify_uid }} --regid={{ modern_tools_verify_gid }} --clear-groups
          bash -i -c 'command -v {{ item.alias }} && {{ item.alias }} --version'
      loop: "{{ modern_tools_packages | selectattr('alias', 'defined') | list }}"
      loop_control:
        label: "{{ item.alias }}"
      environment:
        HOME: /tmp
        TMPDIR: /tmp
      register: modern_tools_alias_smoke
      changed_when: false
      failed_when: >-
        ('/usr/local/bin/' ~ item.alias) not in modern_tools_alias_smoke.stdout
      check_mode: false
      # Also skipped when --check is the run that would have created the
      # symlinks: task 5 only simulates them, so there is nothing to resolve.
      when:
        - modern_tools_can_verify | bool
        - not (ansible_check_mode and modern_tools_links is changed)

    - name: 10. Verify fzf key bindings load for an unprivileged interactive shell
      ansible.builtin.shell:
        cmd: >-
          setpriv --reuid={{ modern_tools_verify_uid }} --regid={{ modern_tools_verify_gid }} --clear-groups
          bash -i -c 'declare -F __fzf_select__'
      environment:
        HOME: /tmp
        TMPDIR: /tmp
      register: modern_tools_fzf_smoke
      changed_when: false
      failed_when: "'__fzf_select__' not in modern_tools_fzf_smoke.stdout"
      check_mode: false
      # Same reasoning as task 9, for the two files tasks 6 and 7 write.
      when:
        - modern_tools_can_verify | bool
        - not (ansible_check_mode
               and (modern_tools_fzf_profile is changed
                    or modern_tools_bashrc is changed))

    - name: 11. Display installation summary
      ansible.builtin.debug:
        msg:
          - "Modern CLI tools installed system-wide:"
          - "{% for t in modern_tools_packages %}  {{ t.name }} {{ t.version }}{% if not loop.last %}{{ '\n' }}{% endif %}{% endfor %}"
          - ""
          - "Verified runnable by an unprivileged user (uid {{ modern_tools_verify_uid }}),"
          - "including fzf key bindings in a non-login interactive shell."
          - ""
          - "apt renames two of these; both are published under the upstream name:"
          - "{% for t in modern_tools_packages | selectattr('alias', 'defined') | list %}  /usr/local/bin/{{ t.alias }} -> /usr/bin/{{ t.binary }}{% if not loop.last %}{{ '\n' }}{% endif %}{% endfor %}"
          - ""
          - "No per-user setup is required: fzf's key bindings and completion"
          - "load from /etc/profile.d/fzf.sh for every interactive shell."
      when: modern_tools_can_verify | bool
